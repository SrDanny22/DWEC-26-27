<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: black;
        }
		h1 {
			color: blue;
		}

        h2 {
            color: blue;
        }
        h3 {
            color: blue;
        }
	</style>

    <script>
	  console.log("JavaScript o EcmaScript");
	  console.log("La última versión de JavaScript es ES2026");
	  console.log("El JavaScript moderno empezó con ES6 (2015)");
	  console.log("EL JavaScript anterior es ES5 (2009)");
	</script>
</head>
<body>
    <h1>Introdución a JavaScript 2026</h1>

    <h2>Tipos de datos en EcmaScript</h2>

    <h3>JavaScript es un lenguaje de tipado dinámico</h3>

    <script>
        "use strict";

        let variable;
        console.log(variable, typeof(variable));

        variable = 1;
        console.log(variable, typeof(variable));

        variable = 1.1;
        console.log(variable, typeof(variable));

        variable = "uno";
        console.log(variable, typeof(variable));

        variable = 'uno';
        console.log(variable, typeof(variable));

        variable = `uno`;
        console.log(variable, typeof(variable));

        variable = true;
        console.log(variable, typeof(variable));

        variable = null;
        console.log(variable, typeof(variable));

        variable = undefined;
        console.log(variable, typeof(variable));

        // Crear objeto
        variable = { nombre: 'Daniel', apellidos: 'Campos García' }
        console.log(variable, typeof(variable));

        variable = [ 'dwec', 'dwes', 'diw', 'da' ];
        console.log(variable, typeof(variable));

        variable = [1, 1.1, 'uno', undefined, null];
        console.log(variable, typeof(variable));

        function saludo() {
            console.log('Buenos días');
        }
        console.log(variable, typeof(saludo));


    </script>
</body>
</html>
