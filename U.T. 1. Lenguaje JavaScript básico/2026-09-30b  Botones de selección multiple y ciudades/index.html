<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script type="module">
        import { ciudades } from "./ciudades.js";

        // Conseguimos el section
        const nSection = document.getElementById('eSection');

        // Bucle para recorrer el array de objetos
        for (let ciudad of ciudades) {

            // Crear el elemento imput y añadirlo al section
            const nInput = document.createElement('input');
            nSection.appendChild(nInput);
            
            // Crear el elemento label y añadirlo al section
            const nLabel = document.createElement('label');
            nSection.appendChild(nLabel);

            // Para separar los checkbox
            const salto = document.createElement('br');
            nSection.appendChild(salto);
    
            // Atributos input
            nInput.setAttribute('type', 'checkbox');
            nInput.setAttribute('name', ciudad.nombre.toLowerCase());
            nInput.setAttribute('id', `eChk${ciudad.nombre}`);
    
            // Atributos label
            nLabel.setAttribute('for', `eChk${ciudad.nombre}`);
    
            // Añadir texto
            const nTxtCiudad = document.createTextNode(ciudad.nombre);
            nLabel.appendChild(nTxtCiudad);

        }
    </script>
</head>
<body>
    <h1>Ciudades de Murcia</h1>

    <section id="eSection">
        
    </section>
</body>
</html>
